<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Video Saver</title>
<style>
  :root {
    --bg: #f3f6f4;
    --surface: #ffffff;
    --ink: #14211c;
    --muted: #5b6b64;
    --line: #d5ded9;
    --accent: #0b6e5b;
    --accent-ink: #ffffff;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1613;
      --surface: #17211d;
      --ink: #e8f0ec;
      --muted: #9bb0a7;
      --line: #2a3a34;
      --accent: #3ecfa9;
      --accent-ink: #07130f;
      --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.02em; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  .bar { display: flex; gap: 8px; }
  input[type="url"] {
    flex: 1;
    min-width: 0;
    padding: 14px 16px;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 10px;
  }
  button, .btn {
    font: inherit;
    font-weight: 600;
    padding: 14px 20px;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  button:disabled { opacity: .6; cursor: wait; }
  input:focus-visible, button:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #message { min-height: 1.5em; margin: 14px 0 0; color: var(--muted); }
  #message.error { color: var(--error); }
  #result {
    display: none;
    margin-top: 20px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    gap: 14px;
    align-items: center;
  }
  #result.show { display: flex; }
  #thumb { width: 84px; height: 112px; object-fit: cover; border-radius: 8px; background: var(--line); flex: none; }
  .meta { min-width: 0; flex: 1; }
  .meta .title { font-weight: 600; margin: 0 0 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .meta .sub { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .note { margin-top: 36px; color: var(--muted); font-size: .85rem; }
  @media (max-width: 480px) { .bar { flex-direction: column; } #result.show { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<main>
  <h1>Save a TikTok video</h1>
  <p class="lead">Paste the video link, then download it as an MP4 file.</p>

  <div class="bar">
    <input id="url" type="url" inputmode="url" placeholder="https://www.tiktok.com/@name/video/..." aria-label="TikTok video link" autocomplete="off">
    <button id="go" type="button">Get video</button>
  </div>
  <p id="message" role="status" aria-live="polite"></p>

  <section id="result" aria-label="Video preview">
    <img id="thumb" alt="">
    <div class="meta">
      <p class="title" id="title"></p>
      <p class="sub" id="sub"></p>
      <a id="dl" class="btn" href="#">Download MP4</a>
    </div>
  </section>

  <p class="note">Only download videos you made or have permission to use. Respect the creator's rights.</p>
</main>

<script>
  const urlInput = document.getElementById("url");
  const go = document.getElementById("go");
  const msg = document.getElementById("message");
  const result = document.getElementById("result");

  function say(text, isError) {
    msg.textContent = text;
    msg.className = isError ? "error" : "";
  }

  async function getVideo() {
    const url = urlInput.value.trim();
    result.classList.remove("show");
    if (!url) { say("Paste a TikTok link first.", true); return; }

    go.disabled = true;
    say("Looking up the video…");
    try {
      const res = await fetch("/api/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      if (!res.ok) { say(data.error || "Something went wrong.", true); return; }

      document.getElementById("thumb").src = data.thumbnail || "";
      document.getElementById("title").textContent = data.title;
      const mins = Math.floor(data.duration / 60), secs = String(Math.round(data.duration % 60)).padStart(2, "0");
      document.getElementById("sub").textContent = [data.uploader, data.duration ? mins + ":" + secs : ""].filter(Boolean).join(" · ");
      document.getElementById("dl").href = "/api/download?url=" + encodeURIComponent(url);
      result.classList.add("show");
      say("");
    } catch (e) {
      say("Can't reach the server. Check your internet and try again.", true);
    } finally {
      go.disabled = false;
    }
  }

  go.addEventListener("click", getVideo);
  urlInput.addEventListener("keydown", e => { if (e.key === "Enter") getVideo(); });
  document.getElementById("dl").addEventListener("click", () => say("Preparing your file. This can take a few seconds on free hosting."));
</script>
</body>
</html>
